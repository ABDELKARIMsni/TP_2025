<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal </title>
<style>
  body {
    background: black;
    color: #00ff00;
    font-family: monospace;
    padding: 20px;
  }
</style>
</head>
<body>

<pre id="terminal"></pre>

<script>
const lines = [
  "Initializing system...",
  "Loading modules...",
  "Connecting...",
  "",
  "IP Address : 192.168.1.10",
  "Operating System : Windows",
  "Browser : Chrome",
  "Navigator : Enabled",
  "Screen : 1920x1080",
  "",
  "Running simulation...",
  "Processing data...",
  "",
  "STATUS : Simulation finished",
  "Result : Fake demo only",
  "virus installed......46%",
  "virus installed...........60%",
  "virus installed...............80%",
  "virus installed................100&",
  "connection made..."
];

let i = 0;
const terminal = document.getElementById("terminal");

function printLine() {
  if (i < lines.length) {
    terminal.textContent += lines[i] + "\n";
    i++;
    setTimeout(printLine, 500); // speed (ms)
  }
}

printLine();
</script>

</body>
</html>
